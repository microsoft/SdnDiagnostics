name: Pester Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Offline Pester Tests
    runs-on: windows-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Module
        run: |
          & .\build.ps1
        shell: powershell

      - name: Run Offline Pester Tests
        run: |
          Set-Location -Path .\tests\offline
          .\RunTests.ps1
        shell: powershell
