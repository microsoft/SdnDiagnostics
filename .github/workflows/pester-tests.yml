name: Pester Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Offline Pester Tests
    runs-on: windows-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build Module
        run: |
          & .\build.ps1
        shell: powershell

      - name: Run Offline Pester Tests
        run: |
          Set-Location -Path .\tests\offline
          .\RunTests.ps1
        shell: powershell
