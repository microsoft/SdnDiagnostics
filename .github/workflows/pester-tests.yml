name: Pester Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Offline Pester Tests
    runs-on: windows-latest

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Build Module
        run: |
          & .\build.ps1
        shell: powershell

      - name: Run Offline Pester Tests
        run: |
          Set-Location -Path .\tests\offline
          $pesterParams = @{
            Path   = '.\*Tests.ps1'
            Output = 'Detailed'
          }
          $results = Invoke-Pester @pesterParams -PassThru
          if ($results.FailedCount -gt 0) {
            throw "$($results.FailedCount) Pester test(s) failed."
          }
          Write-Host "All $($results.PassedCount) tests passed." -ForegroundColor Green
        shell: powershell
